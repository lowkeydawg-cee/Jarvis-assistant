<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg: #070b12;
    --panel: #0e1520;
    --panel-2: #131c2a;
    --line: #1f2b3d;
    --text: #e6edf6;
    --muted: #8193ab;
    --accent: #4cc9f0;
    --accent-2: #7b61ff;
    --ok: #3ddc97;
    --warn: #ffb547;
    --bad: #ff6b6b;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #0f1d33 0%, var(--bg) 60%);
    color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); background: rgba(7, 11, 18, .7); backdrop-filter: blur(8px);
  }
  header h1 { font-size: 17px; letter-spacing: .14em; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap;
  }
  .badge.cloud { color: var(--accent); border-color: #1f4b5c; }
  .badge.local { color: var(--ok); border-color: #1d4a39; }
  .badge.off { color: var(--bad); border-color: #5a2626; }
  .spacer { flex: 1; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .2s; }
  .switch input:checked { background: var(--ok); }
  .switch input:checked::after { transform: translateX(14px); }
  .switch input:disabled { opacity: .4; cursor: not-allowed; }
  button.icon {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px;
    width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center;
  }
  button.icon:hover { color: var(--text); border-color: #2c3d56; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  .stage { display: flex; flex-direction: column; align-items: center; padding: 48px 16px 8px; gap: 10px; }
  .orb {
    --c1: var(--accent); --c2: var(--accent-2);
    width: 150px; height: 150px; border-radius: 50%; position: relative; cursor: pointer; border: 0; padding: 0;
    background: radial-gradient(circle at 50% 45%, #dff6ff 0%, var(--c1) 18%, #0b2a44 55%, transparent 70%);
    box-shadow: 0 0 40px -6px var(--c1), inset 0 0 30px rgba(0,0,0,.6);
    transition: transform .2s;
  }
  .orb::before, .orb::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--c1); border-left-color: var(--c2); opacity: .7;
    animation: spin 6s linear infinite;
  }
  .orb::after { inset: -28px; border-width: 1px; animation-duration: 10s; animation-direction: reverse; opacity: .4; }
  .orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 36px; }
  .orb:hover { transform: scale(1.03); }
  [data-state="listening"] .orb { --c1: var(--ok); --c2: #1fa37a; animation: pulse 1.1s ease-in-out infinite; }
  [data-state="thinking"] .orb { --c1: var(--accent-2); --c2: var(--accent); }
  [data-state="thinking"] .orb::before { animation-duration: 1.2s; }
  [data-state="thinking"] .orb::after { animation-duration: 2s; }
  [data-state="speaking"] .orb { animation: talk .45s ease-in-out infinite alternate; }
  [data-state="confirm"] .orb { --c1: var(--warn); --c2: #ff8a47; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { box-shadow: 0 0 70px 4px var(--c1), inset 0 0 30px rgba(0,0,0,.6); } }
  @keyframes talk { to { transform: scale(1.06); box-shadow: 0 0 70px 0 var(--c1), inset 0 0 30px rgba(0,0,0,.6); } }
  .state { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; min-height: 20px; margin-top: 22px; }
  .interim { color: var(--muted); font-style: italic; min-height: 22px; text-align: center; max-width: 640px; }

  .log { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; margin: 0 auto; flex: 1; }
  .msg { padding: 10px 14px; border-radius: var(--radius); max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); }
  .msg.jarvis { align-self: flex-start; background: linear-gradient(180deg, #0f1f30, #0d1826); border: 1px solid #1a3550; }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; background: none; padding: 2px 8px; }
  .msg.error { align-self: center; color: var(--bad); font-size: 13px; }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }

  .confirm {
    display: none; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 0 auto 8px; padding: 10px 14px; border: 1px solid #5a4520; background: #1d1709; border-radius: var(--radius); color: var(--warn);
  }
  .confirm.show { display: flex; }
  .confirm button { border-radius: 10px; padding: 6px 16px; border: 1px solid var(--line); cursor: pointer; font: inherit; }
  .confirm .yes { background: var(--ok); color: #062015; border-color: var(--ok); }
  .confirm .no { background: transparent; color: var(--text); }

  footer { border-top: 1px solid var(--line); padding: 12px 16px 16px; background: rgba(7, 11, 18, .85); }
  form { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
  form input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 11px 14px; font: inherit; outline: none;
  }
  form input:focus { border-color: #2c5a73; }
  form button { border-radius: 12px; border: 0; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #031620; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  kbd { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font: 11px ui-monospace, monospace; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius);
    width: min(440px, calc(100vw - 32px)); padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 14px; font-size: 16px; }
  dialog label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
  dialog select, dialog input[type=range] { width: 100%; }
  dialog select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; }
  dialog .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  dialog .actions button { border-radius: 10px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; font: inherit; }
  .small { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    .orb { width: 110px; height: 110px; }
    header h1 { font-size: 15px; }
  }
</style>
</head>
<body data-state="idle">
<header>
  <h1>JARVIS</h1>
  <span id="brain" class="badge">connecting</span>
  <div class="spacer"></div>
  <label class="switch" title="Keep thinking on this computer, nothing goes to the cloud model">
    <span>Private</span><input id="private" type="checkbox">
  </label>
  <button id="settingsBtn" class="icon" title="Voice settings" aria-label="Voice settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <div class="stage" style="display:flex;flex-direction:column;min-height:0">
    <button id="orb" class="orb" aria-label="Talk to Jarvis"></button>
    <div id="stateLabel" class="state">Tap the orb to talk</div>
    <div id="interim" class="interim"></div>
    <div id="confirm" class="confirm" role="alertdialog" aria-label="Confirm action">
      <span>Jarvis is asking before it runs that.</span>
      <button class="yes" id="yesBtn">Yes, go ahead</button>
      <button class="no" id="noBtn">No</button>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
  </div>
</main>

<footer>
  <form id="form" autocomplete="off">
    <input id="text" placeholder="Type to Jarvis, or tap the orb and talk" aria-label="Message">
    <button type="submit">Send</button>
  </form>
  <div class="hint"><kbd>Space</kbd> talk &nbsp; <kbd>Esc</kbd> stop Jarvis talking</div>
</footer>

<dialog id="settings">
  <h2>Voice</h2>
  <label for="voice">Jarvis's voice</label>
  <select id="voice"></select>
  <div class="small" id="voiceTip"></div>
  <label for="rate">Speed <span id="rateVal"></span></label>
  <input id="rate" type="range" min="0.8" max="1.4" step="0.05">
  <label for="pitch">Pitch <span id="pitchVal"></span></label>
  <input id="pitch" type="range" min="0.7" max="1.3" step="0.05">
  <div class="row"><span>Hands-free (keeps listening after each reply)</span><label class="switch"><input id="handsfree" type="checkbox"></label></div>
  <div class="row"><span>Interrupt by talking (use headphones)</span><label class="switch"><input id="bargein" type="checkbox"></label></div>
  <div class="actions">
    <button id="testVoice">Test voice</button>
    <button id="resetBtn">New conversation</button>
    <button id="closeSettings">Done</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch {} },
  };
  const prefs = {
    voice: store.get("voice", ""), rate: store.get("rate", 1.05), pitch: store.get("pitch", 0.95),
    handsfree: store.get("handsfree", false), bargein: store.get("bargein", false),
  };

  // ---------- state ----------
  let state = "idle";            // idle | listening | thinking | speaking | confirm
  let thinking = false, confirming = false, listening = false;
  let current = null;            // the Jarvis bubble being filled this turn
  const labels = { idle: "Tap the orb to talk", listening: "Listening", thinking: "Thinking", speaking: "Speaking", confirm: "Say yes or no" };
  function render() {
    const speaking = speechSynthesis.speaking || queue.length > 0;
    state = confirming ? "confirm" : listening ? "listening" : speaking ? "speaking" : thinking ? "thinking" : "idle";
    document.body.dataset.state = state;
    $("stateLabel").textContent = labels[state];
  }

  // ---------- transcript ----------
  function add(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    $("log").appendChild(el);
    el.scrollIntoView({ block: "end", behavior: "smooth" });
    return el;
  }

  // ---------- voice out ----------
  let voices = [];
  const queue = [];
  function rankVoice(v) {
    const n = v.name;
    if (!/^en/i.test(v.lang)) return -1;
    let s = 0;
    if (/Natural|Neural|Online/i.test(n)) s += 50;
    if (/Ryan|Thomas|Guy|Andrew|Brian|Christopher|Eric|Davis/i.test(n)) s += 20;
    if (/en-GB/i.test(v.lang)) s += 10;
    if (/Google UK English Male/i.test(n)) s += 35;
    if (/Daniel/i.test(n)) s += 25; // the good macOS British voice
    return s;
  }
  function loadVoices() {
    voices = speechSynthesis.getVoices().filter((v) => rankVoice(v) >= 0).sort((a, b) => rankVoice(b) - rankVoice(a));
    const sel = $("voice");
    sel.innerHTML = "";
    for (const v of voices) {
      const o = document.createElement("option");
      o.value = v.name; o.textContent = v.name.replace(/^Microsoft /, "") + " (" + v.lang + ")";
      sel.appendChild(o);
    }
    if (!prefs.voice && voices[0]) prefs.voice = voices[0].name;
    sel.value = prefs.voice;
    const natural = voices.some((v) => /Natural/i.test(v.name));
    $("voiceTip").textContent = natural
      ? "Voices marked Natural are neural and sound the most human."
      : "Tip: open this page in Microsoft Edge for natural neural voices like Ryan and Guy.";
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  function speak(text) {
    queue.push(text);
    if (!speechSynthesis.speaking) next();
    render();
  }
  function next() {
    const text = queue.shift();
    if (!text) { render(); afterSpeaking(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find((x) => x.name === prefs.voice);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = prefs.rate; u.pitch = prefs.pitch;
    u.onend = u.onerror = () => next();
    speechSynthesis.speak(u);
    render();
    if (prefs.bargein && recognizer && !listening) startListening(true);
  }
  function stopSpeaking(tellServer) {
    queue.length = 0;
    speechSynthesis.cancel();
    if (tellServer && thinking) post("/api/interrupt");
    render();
  }
  function afterSpeaking() {
    if (thinking) return;
    if (confirming || prefs.handsfree) setTimeout(() => { if (!speechSynthesis.speaking && !queue.length) startListening(); }, 250);
  }

  // ---------- voice in ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null, bargeMode = false;
  if (SR) {
    recognizer = new SR();
    recognizer.lang = "en-US";
    recognizer.interimResults = true;
    recognizer.continuous = false;
    recognizer.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        (r.isFinal ? (final += r[0].transcript) : (interim += r[0].transcript));
      }
      if (bargeMode && (interim + final).trim().split(/\s+/).length >= 2 && (speechSynthesis.speaking || queue.length)) {
        stopSpeaking(true); // you talked over Jarvis
      }
      $("interim").textContent = interim;
      if (final.trim()) { $("interim").textContent = ""; send(final.trim()); }
    };
    recognizer.onend = () => { listening = false; bargeMode = false; render(); };
    recognizer.onerror = (e) => {
      listening = false; render();
      if (e.error === "not-allowed" || e.error === "service-not-allowed") add("error", "Microphone blocked. Allow it from the icon in the address bar.");
      else if (e.error === "network") add("error", "Speech recognition needs internet in this browser.");
    };
  }
  function startListening(barge = false) {
    if (!recognizer) { add("system", "This browser can't listen. Use Edge or Chrome, or just type."); return; }
    if (listening) return;
    if (!barge) stopSpeaking(true);
    bargeMode = barge;
    try { recognizer.start(); listening = true; } catch {}
    render();
  }
  function stopListening() { if (recognizer && listening) recognizer.abort(); listening = false; render(); }

  // ---------- server ----------
  async function post(path, body = {}) {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await r.json();
      if (data.brain) showBrain(data);
      return data;
    } catch { add("error", "Can't reach Jarvis. Is the terminal still running?"); }
  }
  function send(text) {
    if (!text) return;
    add("you", text);
    current = null;
    if (confirming) { post("/api/confirm", { answer: text }); return; }
    thinking = true; render();
    post("/api/chat", { text });
  }
  function showBrain(s) {
    const el = $("brain");
    const priv = $("private");
    priv.checked = s.private || !s.cloud;
    priv.disabled = !s.cloud;
    priv.parentElement.title = s.cloud ? "Keep thinking on this computer" : "No cloud key set, so Jarvis already runs fully local";
    const local = s.private || !s.cloud;
    el.textContent = local ? "local brain" : "cloud brain";
    el.className = "badge " + (local ? "local" : "cloud");
    el.title = s.brain;
  }

  function connect() {
    const es = new EventSource("/api/events");
    es.onopen = () => fetch("/api/status").then((r) => r.json()).then(showBrain).catch(() => {});
    es.onerror = () => { const el = $("brain"); el.textContent = "offline"; el.className = "badge off"; };
    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      if (ev.type === "sentence") {
        if (!current) current = add("jarvis", "");
        current.textContent += (current.textContent ? " " : "") + ev.text;
        current.scrollIntoView({ block: "end", behavior: "smooth" });
        speak(ev.text);
      } else if (ev.type === "state") {
        thinking = ev.state === "thinking";
        if (!thinking && current && ev.provider) {
          const meta = document.createElement("span");
          meta.className = "meta"; meta.textContent = ev.provider === "cloud" ? "cloud brain" : "local brain";
          current.appendChild(meta);
        }
        if (!thinking) { current = null; if (!speechSynthesis.speaking && !queue.length) afterSpeaking(); }
        render();
      } else if (ev.type === "confirm") {
        confirming = true; $("confirm").classList.add("show"); render();
        if (!speechSynthesis.speaking && !queue.length) afterSpeaking();
      } else if (ev.type === "confirm_done") {
        confirming = false; $("confirm").classList.remove("show"); current = null; render();
      } else if (ev.type === "error") {
        add("error", ev.text);
      }
    };
  }

  // ---------- wiring ----------
  $("orb").onclick = () => (listening ? stopListening() : startListening());
  $("form").onsubmit = (e) => { e.preventDefault(); const t = $("text").value.trim(); $("text").value = ""; stopSpeaking(true); send(t); };
  $("yesBtn").onclick = () => send("yes");
  $("noBtn").onclick = () => send("no");
  $("private").onchange = (e) => post("/api/settings", { private: e.target.checked });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || $("settings").open) return;
    if (e.code === "Space") { e.preventDefault(); listening ? stopListening() : startListening(); }
    if (e.key === "Escape") { stopSpeaking(true); stopListening(); }
  });

  $("settingsBtn").onclick = () => { $("rate").value = prefs.rate; $("pitch").value = prefs.pitch; $("handsfree").checked = prefs.handsfree; $("bargein").checked = prefs.bargein; showRange(); $("settings").showModal(); };
  $("closeSettings").onclick = () => $("settings").close();
  function showRange() { $("rateVal").textContent = Number($("rate").value).toFixed(2) + "x"; $("pitchVal").textContent = Number($("pitch").value).toFixed(2); }
  $("voice").onchange = (e) => { prefs.voice = e.target.value; store.set("voice", prefs.voice); };
  $("rate").oninput = (e) => { prefs.rate = Number(e.target.value); store.set("rate", prefs.rate); showRange(); };
  $("pitch").oninput = (e) => { prefs.pitch = Number(e.target.value); store.set("pitch", prefs.pitch); showRange(); };
  $("handsfree").onchange = (e) => { prefs.handsfree = e.target.checked; store.set("handsfree", prefs.handsfree); };
  $("bargein").onchange = (e) => { prefs.bargein = e.target.checked; store.set("bargein", prefs.bargein); };
  $("testVoice").onclick = () => { stopSpeaking(false); speak("Good evening. All systems are running smoothly."); };
  $("resetBtn").onclick = () => { post("/api/reset"); $("log").innerHTML = ""; current = null; add("system", "New conversation."); $("settings").close(); };

  add("jarvis", "Jarvis online. Tap the orb or press space, then talk. You can also type below.");
  connect();
  render();
})();
</script>
</body>
</html>
